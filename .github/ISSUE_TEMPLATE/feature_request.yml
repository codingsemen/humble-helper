name: Feature request
description: Suggest an improvement for Humble Helper
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you would like to see.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome
        - Both
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add bundle URLs, mockups, or screenshots if useful. Never include cookies or tokens.
