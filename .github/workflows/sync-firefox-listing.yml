name: Synchronize Firefox listing

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact successful main CI revision supplying the sync tool and listing
        required: true
        type: string
      version:
        description: Existing listed Firefox version; empty selects the current public AMO version
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing listed Firefox version; empty selects the current public AMO version
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: store-publish
  cancel-in-progress: false
  queue: max

jobs:
  source:
    name: Verify the current main revision passed CI
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject stale, non-main, or unvalidated source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          CURRENT_MAIN="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$SOURCE_SHA" != "$CURRENT_MAIN" ]]; then
            echo "Listing synchronization requires the current main revision; wait for its CI and retry." >&2
            exit 1
          fi
          PASSED="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            --jq "any(.workflow_runs[]; .head_sha == \"$SOURCE_SHA\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")")"
          if [[ "$PASSED" != "true" ]]; then
            echo "The selected main revision has no successful push CI run; wait for CI before synchronizing." >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  listing:
    name: Synchronize metadata without uploading an extension
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: browser-stores
    permissions:
      contents: read
    steps:
      - name: Check out the tested main listing and sync tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify source is still current before editing the listing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" == "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" ]]
      - name: Synchronize AMO metadata, icon, and previews
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$AMO_VERSION" ]]; then
            node scripts/run-amo-listing-sync.mjs --version "$AMO_VERSION"
          else
            node scripts/run-amo-listing-sync.mjs
          fi
