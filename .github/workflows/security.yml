name: Weekly dependency security

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-dependency-security
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: High-severity dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Audit the lockfile with reviewed, expiring exceptions
        run: pnpm run audit:release
