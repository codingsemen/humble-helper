name: Publish browser stores

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string
      target:
        description: Store to publish
        required: true
        type: string
      source_sha:
        description: Exact successful current-main CI revision supplying publishing tools
        required: false
        default: ''
        type: string
      allow_existing_firefox:
        description: Permit retrying an already-reserved Firefox version
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish (for example, v1.2.3)
        required: true
        type: string
      target:
        description: Store to publish
        required: true
        type: choice
        options:
          - firefox
          - chrome
          - both

permissions:
  contents: read
  actions: read

concurrency:
  group: store-publish
  cancel-in-progress: false
  queue: max

jobs:
  source:
    name: Verify tested publishing tools and immutable release source
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the exact current-main tools revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject stale tools or release source outside main
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$RELEASE_SHA" "$SOURCE_SHA"
          CURRENT_MAIN="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$SOURCE_SHA" != "$CURRENT_MAIN" ]]; then
            echo "Publishing tools must come from current main; wait for its CI and retry." >&2
            exit 1
          fi
          PASSED="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            --jq "any(.workflow_runs[]; .head_sha == \"$SOURCE_SHA\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")")"
          if [[ "$PASSED" != "true" ]]; then
            echo "The publishing-tools revision has no successful push CI run." >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  firefox:
    name: Submit Firefox package
    if: inputs.target == 'firefox' || inputs.target == 'both'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: browser-stores
    permissions:
      contents: read
    steps:
      - name: Check out the tested current-main publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install the pinned Mozilla publishing tool
        run: pnpm install --frozen-lockfile
      - name: Audit the publishing tool dependencies
        run: pnpm run audit:release
      - name: Download and verify the released Firefox package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          export HUMBLE_RELEASE_VERSION="$VERSION"
          mkdir release-artifacts
          gh release download "$RELEASE_TAG" \
            --pattern "humble-helper-$VERSION-firefox.zip" \
            --pattern SHA256SUMS \
            --dir release-artifacts
          node scripts/release-artifacts.mjs verify "$RELEASE_TAG" release-artifacts firefox --source-ref "$RELEASE_TAG"
          mkdir release-artifacts/firefox-source
          unzip -q "release-artifacts/humble-helper-$VERSION-firefox.zip" \
            -d release-artifacts/firefox-source
      - name: Check whether Mozilla already received this version
        id: submission
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_EXISTING: ${{ github.event_name == 'workflow_dispatch' || inputs.allow_existing_firefox }}
        run: |
          if [[ "$ALLOW_EXISTING" == "true" ]]; then
            node scripts/check-amo-version.mjs "$RELEASE_TAG"
          else
            node scripts/check-amo-version.mjs "$RELEASE_TAG" --require-new
          fi
      - name: Verify publishing tools are still current before submission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" == "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" ]]
      - name: Generate submission metadata and submit to Mozilla Add-ons
        if: steps.submission.outputs.exists != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          node scripts/sync-amo-listing.mjs \
            --write-submission-metadata release-artifacts/amo-metadata.json
          pnpm exec web-ext --no-config-discovery sign \
            --source-dir release-artifacts/firefox-source \
            --artifacts-dir release-artifacts/firefox-signed \
            --channel listed \
            --amo-metadata release-artifacts/amo-metadata.json \
            --approval-timeout 0 \
            --timeout 300000 \
            --no-input

  chrome:
    name: Submit Chrome package
    if: inputs.target == 'chrome' || inputs.target == 'both'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: browser-stores
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download and verify the released Chrome package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          export HUMBLE_RELEASE_VERSION="$VERSION"
          mkdir release-artifacts
          gh release download "$RELEASE_TAG" \
            --pattern "humble-helper-$VERSION-chrome.zip" \
            --pattern SHA256SUMS \
            --dir release-artifacts
          node scripts/release-artifacts.mjs verify "$RELEASE_TAG" release-artifacts chrome
      - name: Authenticate to Google without a stored service-account key
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit to the Chrome Web Store
        shell: bash
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export HUMBLE_RELEASE_VERSION="$VERSION"
          node scripts/publish-chrome.mjs "release-artifacts/humble-helper-$VERSION-chrome.zip"
