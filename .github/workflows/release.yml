name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Check JavaScript syntax
        run: pnpm run check
      - name: Audit release dependencies
        run: pnpm audit --audit-level high
      - name: Lint and build both browser packages
        run: pnpm run build
      - name: Prepare named release packages and checksums
        run: pnpm run release:prepare -- "$GITHUB_REF_NAME"
      - name: Hand release packages to the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts
      - name: Create and publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists and is published; refusing to mutate it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --draft \
              --generate-notes \
              --title "Humble Helper $VERSION" \
              --verify-tag
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest

  publish-stores:
    name: Publish browser stores
    needs: github-release
    if: vars.ENABLE_STORE_PUBLISHING == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-stores.yml
    with:
      release_tag: ${{ github.ref_name }}
      target: both
    secrets: inherit
